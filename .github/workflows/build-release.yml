name: build-frozen-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PIP_CONSTRAINT: packaging/build-constraints.txt
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PIP_ONLY_BINARY: ":all:"

concurrency:
  group: sentinel-blue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pip==26.2.1"
      - run: python -m pip install . "pyinstaller==6.22.2"
      - run: python tools/check_release_consistency.py
      - run: python -m unittest discover -s tests -v
      - run: python -m sentinel_blue self-test --scenarios 100 --fuzz-iterations 1000 --load-events 250 --json
      - run: node --check portal-extension/popup.js
      - run: node --check portal-extension/content.js
      - run: python tools/build_release.py --output release
      - run: pyinstaller --clean --onefile --name sentinel-blue --collect-data sentinel_blue packaging/sentinel_blue_entry.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-blue-${{ matrix.os }}
          path: |
            dist/sentinel-blue*
            release/sentinel-blue-*
            release/SHA256SUMS
