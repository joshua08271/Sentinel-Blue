name: defender-validation

on:
  push:
    branches: [maintenance/defender-1.9.42]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: defender-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-defensive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src:tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run all supplied defensive regressions
        run: python -m unittest discover -s tests -v
      - name: Build the matching defender runtime and source
        run: python -m tools.build_defensive_release --output dist --bundle
      - name: Validate packaged continuity and bounded local transports
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import sys
          import tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          runtime = pathlib.Path(f'dist/sentinel-blue-{version}.pyz').resolve()
          output = pathlib.Path('validation-output')
          output.mkdir()
          with (output / 'lifecycle.json').open('w') as report:
              subprocess.run([sys.executable, 'tools/smoke_release.py', str(runtime),
                              '--exercise-crash-resume'], stdout=report, check=True, timeout=180)
          environment = dict(os.environ, PYTHONPATH=str(runtime))
          subprocess.run([sys.executable, 'tools/agent_transport_rehearsal.py', '--repeats', '5',
                          '--output', str(output / 'transport.json')], env=environment, check=True, timeout=60)
          subprocess.run([sys.executable, 'tools/probe_timing_rehearsal.py', '--runtime', str(runtime),
                          '--repeats', '5', '--output', str(output / 'probe-timing.json')], check=True, timeout=60)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: defender-linux-validation
          path: |
            validation-output/
            dist/
          retention-days: 14

  windows-integrity:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .;src;tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate native file handles, inventory lifetime, and coverage
        run: >-
          python -m unittest tests.test_windows_integrity_budget tests.test_windows_inventory_host
          tests.test_windows_query_batch tests.test_integrity_coverage tests.test_process_coverage
          tests.test_defensive_distribution
          tests.test_setup.SetupTests.test_slow_feature_inventory_uses_one_continuous_shared_allowance
          tests.test_setup.SetupTests.test_feature_query_retry_cannot_extend_total_native_allowance
          tests.test_setup.SetupTests.test_late_native_success_never_authorizes_setup_mutation -v
      - name: Build the Windows defender distribution
        run: python -m tools.build_defensive_release --output dist --bundle
