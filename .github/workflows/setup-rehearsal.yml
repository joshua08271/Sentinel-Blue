name: setup-rehearsal

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-setup:
    name: Native initial setup (${{ matrix.os }})
    if: >-
      github.actor == 'joshua08271' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      SENTINEL_BLUE_DISPOSABLE_LAB: github-hosted-ephemeral-runner
      SENTINEL_BLUE_WINDOWS_DISPOSABLE_LAB: github-hosted-ephemeral-windows-runner
      SENTINEL_BLUE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install and test setup logic
        run: |
          python -m pip install .
          python -m unittest discover -s tests -p 'test_setup*.py' -v
          python -m unittest discover -s tests -p 'test_probes.py' -v

      - name: Build exact runtime
        run: python tools/build_release.py --output dist

      - name: Provision owned Linux web, DNS, SQL, and FTP services
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python_path="$(command -v python)"
          runtime="$(find dist -maxdepth 1 -name 'sentinel-blue-*.pyz' -print -quit)"
          sudo --preserve-env=SENTINEL_BLUE_DISPOSABLE_LAB,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_ACTOR,GITHUB_EVENT_NAME,GITHUB_RUN_ID,GITHUB_SHA,GITHUB_WORKSPACE,RUNNER_ENVIRONMENT,RUNNER_OS \
            "${python_path}" tools/setup_native_rehearsal.py --runtime "${runtime}" --output native-setup-report.json

      - name: Provision owned Windows IIS and DNS services
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = (Get-ChildItem dist/sentinel-blue-*.pyz | Select-Object -First 1).FullName
          python tools/setup_native_rehearsal.py --runtime "$runtime" --output native-setup-report.json

      - name: Upload sanitized setup measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sentinel-native-setup-${{ matrix.os }}
          path: native-setup-report.json
          retention-days: 14
          if-no-files-found: warn
