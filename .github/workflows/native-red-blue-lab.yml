name: native-red-blue-lab

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-blue-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-native-runner:
    name: Disposable native runner campaign
    if: >-
      github.actor == 'joshua08271' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SENTINEL_BLUE_DISPOSABLE_LAB: github-hosted-ephemeral-runner
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install candidate
        run: python -m pip install .

      - name: Run the complete non-privileged regression suite
        run: python -m unittest discover -s tests -v

      - name: Run owner-gated native red-on-blue campaign
        shell: bash
        run: |
          set -euo pipefail
          python_path="$(command -v python)"
          sudo --preserve-env=SENTINEL_BLUE_DISPOSABLE_LAB,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_ACTOR,GITHUB_EVENT_NAME,GITHUB_RUN_ID,GITHUB_SHA,GITHUB_WORKSPACE,RUNNER_ENVIRONMENT,RUNNER_OS \
            "${python_path}" -m sentinel_blue native-lab \
            --output "${GITHUB_WORKSPACE}/native-live-report.json" \
            --json

      - name: Summarize native campaign
        if: always() && hashFiles('native-live-report.json') != ''
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("native-live-report.json").read_text(encoding="utf-8"))
          scenarios = report.get("scenarios", [])
          lines = [
              "### Sentinel Blue native red-on-blue lab",
              "",
              f"- Status: **{report.get('status', 'unknown')}**",
              f"- Scenarios: {report.get('scenarios_passed', 0)}/{report.get('scenario_count', 0)}",
              f"- Cleanup verified: {report.get('cleanup', {}).get('verified', False)}",
              f"- External targets contacted: {report.get('scope', {}).get('external_targets_contacted', 0)}",
              "",
              "| Scenario | Detection | Response | Native result |",
              "|---|---|---|---|",
          ]
          for scenario in scenarios:
              lines.append(
                  "| {name} | {alert} | {action} | {result} |".format(
                      name=scenario.get("name", "unknown"),
                      alert=scenario.get("expected_alert", "unknown"),
                      action=scenario.get("response_action", "unknown"),
                      result="pass" if scenario.get("response_success") else "fail",
                  )
              )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload sanitized native report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-blue-native-red-blue-report
          retention-days: 14
          if-no-files-found: warn
          path: native-live-report.json
