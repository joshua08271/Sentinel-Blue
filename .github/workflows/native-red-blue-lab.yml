name: native-red-blue-lab

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-blue-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-native-runner:
    name: Disposable Linux-native runner campaign
    if: >-
      github.actor == 'joshua08271' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SENTINEL_BLUE_DISPOSABLE_LAB: github-hosted-ephemeral-runner
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install candidate
        run: python -m pip install .

      - name: Run the complete non-privileged regression suite
        run: python -m unittest discover -s tests -v

      - name: Run owner-gated native red-on-blue campaign
        shell: bash
        run: |
          set -euo pipefail
          python_path="$(command -v python)"
          sudo --preserve-env=SENTINEL_BLUE_DISPOSABLE_LAB,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_ACTOR,GITHUB_EVENT_NAME,GITHUB_RUN_ID,GITHUB_SHA,GITHUB_WORKSPACE,RUNNER_ENVIRONMENT,RUNNER_OS \
            "${python_path}" -m sentinel_blue native-lab \
            --output "${GITHUB_WORKSPACE}/native-live-report.json" \
            --json

      - name: Summarize native campaign
        if: always() && hashFiles('native-live-report.json') != ''
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("native-live-report.json").read_text(encoding="utf-8"))
          scenarios = report.get("scenarios", [])
          lines = [
              "### Sentinel Blue native red-on-blue lab",
              "",
              f"- Status: **{report.get('status', 'unknown')}**",
              f"- Scenarios: {report.get('scenarios_passed', 0)}/{report.get('scenario_count', 0)}",
              f"- Cleanup verified: {report.get('cleanup', {}).get('verified', False)}",
              f"- External targets contacted: {report.get('scope', {}).get('external_targets_contacted', 0)}",
              "",
              "| Scenario | Detection | Response | Native result |",
              "|---|---|---|---|",
          ]
          for scenario in scenarios:
              lines.append(
                  "| {name} | {alert} | {action} | {result} |".format(
                      name=scenario.get("name", "unknown"),
                      alert=scenario.get("expected_alert", "unknown"),
                      action=scenario.get("response_action", "unknown"),
                      result="pass" if scenario.get("response_success") else "fail",
                  )
              )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload sanitized native report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-blue-native-red-blue-report
          retention-days: 14
          if-no-files-found: warn
          path: native-live-report.json

  disposable-windows-native-runner:
    name: Disposable Windows-native runner campaign
    if: >-
      github.actor == 'joshua08271' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      SENTINEL_BLUE_WINDOWS_DISPOSABLE_LAB: github-hosted-ephemeral-windows-runner
      SENTINEL_BLUE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install candidate
        shell: pwsh
        run: python -m pip install .

      - name: Run the complete non-privileged regression suite
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Run owner-gated Windows-native red-on-blue campaign
        shell: pwsh
        run: >-
          python -m sentinel_blue windows-native-lab
          --output "$env:GITHUB_WORKSPACE\windows-native-live-report.json"
          --json

      - name: Summarize Windows-native campaign
        if: always() && hashFiles('windows-native-live-report.json') != ''
        shell: pwsh
        run: |
          $report = Get-Content -Raw -Path 'windows-native-live-report.json' | ConvertFrom-Json
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('### Sentinel Blue Windows-native red-on-blue lab')
          $lines.Add('')
          $lines.Add("- Status: **$($report.status)**")
          $lines.Add("- Scenarios: $($report.scenarios_passed)/$($report.scenario_count)")
          $lines.Add("- Cleanup verified: $($report.cleanup.verified)")
          $lines.Add("- External targets contacted: $($report.scope.external_targets_contacted)")
          $lines.Add('')
          $lines.Add('| Scenario | Detection | Response | Native result |')
          $lines.Add('|---|---|---|---|')
          foreach ($scenario in @($report.scenarios)) {
            $result = if ($scenario.response_success) { 'pass' } else { 'fail' }
            $lines.Add("| $($scenario.name) | $($scenario.expected_alert) | $($scenario.response_action) | $result |")
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($lines -join "`n")

      - name: Upload sanitized Windows-native report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-blue-windows-native-red-blue-report
          retention-days: 14
          if-no-files-found: warn
          path: windows-native-live-report.json

  windows-collection-pressure:
    name: Disposable Windows collection pressure
    if: >-
      github.actor == 'joshua08271' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install candidate
        shell: pwsh
        run: python -m pip install .

      - name: Measure native Windows collection during sustained CPU load
        shell: pwsh
        run: >-
          python tools/measure_collection_pressure.py
          --load-seconds 180 --samples 3
          --output windows-collection-pressure-report.json

      - name: Measure native Windows collection with one available CPU
        if: success() || failure()
        shell: pwsh
        run: >-
          python tools/measure_collection_pressure.py
          --cpu-limit 1 --workers 1 --load-seconds 180 --samples 3
          --output windows-single-cpu-pressure-report.json

      - name: Upload sanitized collection pressure reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-blue-windows-collection-pressure
          retention-days: 14
          if-no-files-found: warn
          path: |
            windows-collection-pressure-report.json
            windows-single-cpu-pressure-report.json
