name: continuous-validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: sentinel-blue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m sentinel_blue self-test --scenarios 500 --fuzz-iterations 5000 --load-events 1000 --json
      - run: python -m sentinel_blue range --runs 1000 --json
      - run: python -m sentinel_blue restoration-lab --runs 1000 --json

  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pyinstaller
      - run: python tools/check_release_consistency.py --expected 1.9.13
      - run: python tools/build_release.py --output release
      - run: python tools/check_release_consistency.py --expected 1.9.13 --bundle release/sentinel-blue-complete-lab-1.9.13.zip
      - run: python tools/smoke_release.py release/sentinel-blue-1.9.13.pyz
      - run: pyinstaller --clean --onefile --name sentinel-blue --collect-data sentinel_blue packaging/sentinel_blue_entry.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-blue-${{ runner.os }}-validated
          retention-days: 14
          path: |
            dist/sentinel-blue*
            release/sentinel-blue-*
            release/SHA256SUMS
